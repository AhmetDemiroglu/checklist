<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertel Lojistik - Yakıt Modülü Revizyonları (Canlı)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .task-item .task-text {
            transition: color 0.3s ease-in-out;
        }
        /* Frontend Bitti - Yeşil Çizgi */
        .status-fe-done .task-text {
            text-decoration: line-through;
            text-decoration-color: #22c55e; /* green-500 */
            text-decoration-thickness: 2px;
            color: #4ade80; /* green-400 */
        }
        /* Backend Bitti - Mavi Çizgi */
        .status-be-done .task-text {
            text-decoration: line-through;
            text-decoration-color: #3b82f6; /* blue-500 */
            text-decoration-thickness: 2px;
            color: #60a5fa; /* blue-400 */
        }
        /* FE Bitti, BE Bekleniyor - Turuncu Text */
        .status-fe-awaiting-be .task-text {
            color: #f97316; /* orange-500 */
            font-weight: 500;
        }
        /* BE Bitti, FE Bekleniyor - Koyu Turuncu Text */
        .status-be-awaiting-fe .task-text {
            color: #ca8a04; /* yellow-600 */
            font-weight: 500;
        }

        #connection-status {
            transition: opacity 0.5s;
        }
        .radio-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            min-width: 280px; /* Butonların sıkışmasını önle */
            margin-left: auto;
            padding-left: 1rem;
        }
        .radio-buttons input {
            cursor: pointer;
            width: 1.25rem;
            height: 1.25rem;
        }
        .radio-fe-done { accent-color: #22c55e; }
        .radio-be-done { accent-color: #3b82f6; }
        .radio-fe-awaiting-be { accent-color: #f97316; }
        .radio-be-awaiting-fe { accent-color: #ca8a04; }

        .legend-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 0.75rem;
            line-height: 1rem;
            color: #4b5563; /* gray-600 */
            font-weight: 500;
        }

        /* YENİ: Not bölümü için stiller */
        .note-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
        }
        .note-section.show {
            max-height: 150px;
            padding-top: 0.5rem;
            padding-bottom: 0.75rem;
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        
        <div class="flex items-center justify-between mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Sertel Lojistik - Yakıt Modülü Revizyonları</h1>
                <p class="text-gray-500 mt-1">Geliştirme ve iyileştirme görevlerinin canlı takip listesi.</p>
            </div>
             <div id="connection-status" class="flex items-center space-x-2 opacity-0">
                <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                <span id="connection-text" class="text-sm font-medium text-red-600">Bağlantı Kuruluyor...</span>
            </div>
        </div>

        <!-- İlerleme ve Özet Alanı -->
        <div class="mb-8 px-2">
            <div class="flex justify-between items-center mb-2">

                </div>

                    <div id="waiting-for-be-count" class="text-2xl font-bold text-orange-700">0</div>
                    <div class="text-sm font-medium text-orange-600">Backend Bekleniyor (FE>BE)</div>
                </div>
                <div class="bg-yellow-50 p-3 rounded-lg">
                    <div id="waiting-for-fe-count" class="text-2xl font-bold text-yellow-700">0</div>

                </div>

        <!-- Legend -->
        <div class="flex justify-end mb-4 px-2">
             <div class="radio-buttons">
                <div class="legend-item" title="Frontend %100 Tamamlandı">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                    <span>FE Bitti</span>
                </div>
                <div class="legend-item" title="Backend %100 Tamamlandı">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                    <span>BE Bitti</span>
                </div>
                 <div class="legend-item" title="Frontend Tamamlandı, Backend Bekleniyor">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-orange-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.414-1.415L11 9.586V6z" clip-rule="evenodd" /></svg>
                    <span>FE>BE</span>

                 <div class="legend-item" title="Backend Tamamlandı, Frontend Bekleniyor">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.414-1.415L11 9.586V6z" clip-rule="evenodd" /></svg>
                    <span>BE>FE</span>

        </div>

        <div id="task-list" class="space-y-6">
            <!-- Görevler buraya dinamik olarak eklenecek -->

    </div>

    <script type="module">

        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const tasks = [
            {
                section: "1. Genel İyileştirmeler",
                items: [
                    { id: 's1_a', text: 'Filtreler çoğaltılsın.', status: 0 },
                    { id: 's1_b', text: 'Yakıtlar ayrı bir modül haline getirilsin, ismi “Yakıt Yönetimi” olsun.', status: 0 },

                    { id: 's2_b', text: 'Kapatılan sipariş hareketleri silinebiliyor, bu engellenmeli.', status: 0 },

                    { id: 's2_e', text: 'Depo dolumunda sipariş durumu “Bakiye Kapatıldı” olmasına rağmen, tabloda sipariş durumu alanına yansımıyor.', status: 0 },

                    { id: 's3_f', text: 'Sipariş miktarındaki ondalık değerlerin yuvarlanması sorunu düzeltilsin.', status: 0 },
                    { id: 's3_g', text: 'Sipariş numarası otomatik üretilsin.', status: 0 },
                    { id: 's3_h', text: 'Geçmişe sipariş girişi maksimum 1 hafta öncesine kadar yapılabilsin.', status: 0 },
                    { id: 's3_i', text: 'Araç ve treyler plakalarında aynı plaka aynı anda seçilemesin.', status: 0 },
                ]
            },
            {
                section: "4. Akaryakıt Depoları",
                items: [
                    { id: 's4_a', text: 'İşten çıkan personel, “Çalışanları Yönet” listelerinde görünmesin.', status: 0 },
                    { id: 's4_b', text: 'Akaryakıt deposu miktarının noktalı (50.000) girişte hatalı kaydedilmesi düzeltilsin.', status: 0 },

                    { id: 's4_g', text: 'Depo ismi güncelleme butonunun çalışmaması sorunu çözülsün.', status: 0 },
                    { id: 's4_h', text: 'Depo Sorumlusu alanında karmaşık karakterler yerine isim görünsün.', status: 0 },
                ]
            },
            {
                section: "5. Depo Sınıfı – Entegre Depo Sınıfı",
                items: [
                    { id: 's5_a', text: 'Boş kayıt oluşturulmasın.', status: 0 },

            },
            {

                items: [

            {

            },
            {

                items: [
                    { id: 's8_a', text: 'Hiçbir alan doldurulmadan kayıt yapılabiliyor, zorunlu alanlar işaretlenmeli.', status: 0 },
                    { id: 's8_b', text: 'Belge türü ve fiyat listesi alanları kaldırılsın.', status: 0 },
                    { id: 's8_c', text: 'Kantar ölçümünden “Konum” alanı kaldırılsın.', status: 0 },
                    { id: 's8_d', text: 'Kg/hacim gösterimleri nokta/virgül formatına uygun hale getirilsin.', status: 0 },
                    { id: 's8_e', text: '“Kantar-1 ölçümü” zorunlu olsun.', status: 0 },
                    { id: 's8_f', text: 'Kantarda boş kısmına doludan fazla giriş yapılmasın.', status: 0 },
                    { id: 's8_g', text: 'Giriş tarihi çıkış tarihinden sonra olamasın.', status: 0 },
                    { id: 's8_h', text: 'Teslim tarihi sevk zamanından önce girilemesin.', status: 0 },
                    { id: 's8_i', text: '“Şahit Seri No” alanı, “e-irsaliye” alanının altına taşınsın.', status: 0 },
                    { id: 's8_j', text: 'Laboratuvar ölçüm verileri otomatik dolu gelmesin, boş gelsin.', status: 0 },
                    { id: 's8_k', text: 'Göz göz yakıt girişi yapılacak alan veri işleme formuna eklensin.', status: 0 },
                ]
            },
            {
                section: "9. Depo Sınıfı Sayfaları",
                items: [
                    { id: 's9_a', text: 'Tablo görünümünde görsel düzenleme yapılmalı.', status: 0 },
                ]
            },
            {
                section: "10. Yakıt Çıkış Raporları",
                items: [
                    { id: 's10_a', text: 'Tabloya görev yeri sütunu eklensin.', status: 0 },
                    { id: 's10_b', text: 'Klima yakıtları ve AdBlue yakıtları da raporlansın.', status: 0 },
                    { id: 's10_c', text: 'Veri girişi buradan yapılmasın, sayfanın ismi “Yakıt Çıkışları” olsun.', status: 0 },
                    { id: 's10_d', text: 'Şubeye göre filtreleme ve toplam görünsün.', status: 0 },
                    { id: 's10_e', text: '“Temizle” butonuna basınca tüm verilerin kaybolması sorunu düzeltilsin.', status: 0 },
                    { id: 's10_f', text: 'Raporlara sayfalama eklensin.', status: 0 },
                ]
            },
            {
                section: "11. Depo Doluluk Seviyeleri",
                items: [
                    { id: 's11_a', text: 'Filtrelerin isimleri placeholder yerine başlık olarak kutucukların üstünde görünsün.', status: 0 },
                    { id: 's11_b', text: 'Min, max, kritik, ort değerleri grafikte gerçek seviyelere uygun işaretlensin.', status: 0 },
                    { id: 's11_c', text: 'Kritik seviye çizgilerinin görünmemesi sorunu düzeltilsin ve renklendirilsin.', status: 0 },
                    { id: 's11_d', text: 'Grafik ve tablo verilerinin birbiriyle tutarlı olması sağlansın.', status: 0 },
                ]
            }
        ];

        // --- UYGULAMA MANTIĞI ---
        const taskListContainer = document.getElementById('task-list');
        const connectionStatus = document.getElementById('connection-status');
        const connectionText = document.getElementById('connection-text');

        let db;  
        let checklistDocRef; 

        async function setupFirebase() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyBkE1ZA4R8H8dtXzQK3_1f-ziASaqRWbNM",
                    authDomain: "checklist-44855.firebaseapp.com",
                    projectId: "checklist-44855",
                    storageBucket: "checklist-44855.firebasestorage.app",
                    messagingSenderId: "287422053970",
                    appId: "1:287422053970:web:0f47ebb4fa2e98aba0298b"
                };

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);
                
                const docPath = `checklists/sertel_tms_yakit_revizyon_v1`;
                checklistDocRef = doc(db, docPath);

                await signInAnonymously(auth);
                
                listenForUpdates();

            } catch (error) {
                console.error("Firebase initialization error:", error);
                connectionStatus.style.opacity = 1;
                connectionText.textContent = `Bağlantı hatası. Ortak çalışma özelliği devre dışı.`;
                renderTasks();
            }
        }

        function listenForUpdates() {
            onSnapshot(checklistDocRef, (docSnap) => {
                const statusDiv = connectionStatus.querySelector('div');
                statusDiv.classList.remove('bg-red-500');
                statusDiv.classList.add('bg-green-500', 'animate-pulse');
                connectionText.textContent = 'Canlı Bağlantı Aktif';
                connectionText.classList.remove('text-red-600');
                connectionText.classList.add('text-gray-600');
                connectionStatus.style.opacity = 1;

                if (docSnap.exists()) {
                    const savedTasks = docSnap.data().tasks || [];
                    tasks.forEach(section => {
                        section.items.forEach(item => {
                            const savedItem = savedTasks.find(t => t.id === item.id);
                            if (savedItem && typeof savedItem.status === 'number') {
                                item.status = savedItem.status;
                                item.note = savedItem.note || ''; // Notu al
                            } else {
                                item.status = 0;
                                item.note = '';
                            }
                        });
                    });
                } else {
                    saveState();
                }
                renderTasks();
                updateProgress();
            }, (error) => {
                console.error("Firestore listener error:", error);
                const statusDiv = connectionStatus.querySelector('div');
                statusDiv.classList.add('bg-red-500');
                statusDiv.classList.remove('bg-green-500', 'animate-pulse');
                connectionText.textContent = 'Bağlantı Koptu';
                connectionText.classList.add('text-red-600');
                connectionText.classList.remove('text-gray-600');
                connectionStatus.style.opacity = 1;
            });
        }

        async function saveState() {
            if (!checklistDocRef) return;
            const stateToSave = tasks.flatMap(section => 
                section.items.map(item => ({ id: item.id, status: item.status, note: item.note || '' })) // Notu da kaydet
            );
            try {
                await setDoc(checklistDocRef, { tasks: stateToSave });
            } catch (error) {
                console.error("Error saving state to Firestore:", error);
            }
        }
        
        function handleStatusChange(item, newStatus) {
            item.status = newStatus;
            renderTasks();
            updateProgress();
            saveState();
        }

        function updateProgress() {
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const completedCountEl = document.getElementById('completed-count');
            const waitingForBeCountEl = document.getElementById('waiting-for-be-count');
            const waitingForFeCountEl = document.getElementById('waiting-for-fe-count');

            if (!progressBar || !completedCountEl) return;

            const allItems = tasks.flatMap(s => s.items);
            const totalTasks = allItems.length;
            if (totalTasks === 0) return;

            const completedTasks = allItems.filter(item => item.status === 1 || item.status === 2).length;
            const waitingForBeTasks = allItems.filter(item => item.status === 3).length;
            const waitingForFeTasks = allItems.filter(item => item.status === 4).length;
            
            const percentage = Math.round((completedTasks / totalTasks) * 100);

            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}% (${completedTasks}/${totalTasks})`;

            completedCountEl.textContent = completedTasks;
            waitingForBeCountEl.textContent = waitingForBeTasks;
            waitingForFeCountEl.textContent = waitingForFeTasks;
        }


        function renderTasks() {
            taskListContainer.innerHTML = '';
            tasks.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.innerHTML = `<h2 class="text-xl font-semibold text-gray-700 border-b border-gray-200 pb-2 mb-4">${section.section}</h2>`;
                const itemList = document.createElement('div');
                itemList.className = 'space-y-1';

                section.items.forEach(item => {
                    const itemContainer = document.createElement('div');
                    
                    let statusClass = '';
                    switch (item.status) {
                        case 1: statusClass = 'status-fe-done'; break;
                        case 2: statusClass = 'status-be-done'; break;
                        case 3: statusClass = 'status-fe-awaiting-be'; break;
                        case 4: statusClass = 'status-be-awaiting-fe'; break;
                    }

                    const hasNote = item.note && item.note.trim() !== '';
                    const noteIcon = hasNote 
                        ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2zM7 8H5v2h2V8zm2 0h2v2H9V8zm6 0h-2v2h2V8z" clip-rule="evenodd" /></svg>` 
                        : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" /></svg>`;


                    const taskRowHTML = `
                        <div class="task-item flex items-center p-2 rounded-lg hover:bg-gray-50 ${statusClass}">
                            <span class="flex-grow task-text font-medium text-gray-800">${item.text}</span>
                            <div class="radio-buttons">
                                <input type="radio" class="radio-fe-done" name="status-${item.id}" value="1" title="Frontend %100 Tamamlandı" ${item.status === 1 ? 'checked' : ''}>
                                <input type="radio" class="radio-be-done" name="status-${item.id}" value="2" title="Backend %100 Tamamlandı" ${item.status === 2 ? 'checked' : ''}>
                                <input type="radio" class="radio-fe-awaiting-be" name="status-${item.id}" value="3" title="Frontend Tamamlandı, Backend Bekleniyor" ${item.status === 3 ? 'checked' : ''}>
                                <input type="radio" class="radio-be-awaiting-fe" name="status-${item.id}" value="4" title="Backend Tamamlandı, Frontend Bekleniyor" ${item.status === 4 ? 'checked' : ''}>
                            </div>
                            <button class="note-toggle-btn ml-4 text-gray-400 hover:text-blue-600 p-1 rounded-full">
                                ${noteIcon}
                            </button>
                        </div>
                    `;

                    const noteSectionHTML = `
                        <div class="note-section bg-gray-50 rounded-b-lg px-4">
                            <textarea class="w-full p-2 border rounded-md text-sm mt-2" placeholder="Notunuzu buraya ekleyin...">${item.note || ''}</textarea>
                            <div class="text-right my-2">
                                <button class="note-save-btn text-sm bg-blue-500 text-white px-3 py-1 rounded-md hover:bg-blue-600">Kaydet</button>
                            </div>
                        </div>
                    `;
                    
                    itemContainer.innerHTML = taskRowHTML + noteSectionHTML;

                    const noteSection = itemContainer.querySelector('.note-section');

                    itemContainer.querySelector('.note-toggle-btn').addEventListener('click', () => {
                        noteSection.classList.toggle('show');
                    });

                    noteSection.querySelector('.note-save-btn').addEventListener('click', () => {
                        const noteText = noteSection.querySelector('textarea').value;
                        item.note = noteText;
                        saveState(); 
                        noteSection.classList.remove('show');
                    });
                    
                    const currentStatus = item.status;
                    itemContainer.querySelectorAll('input[type="radio"]').forEach(radio => {
                        radio.addEventListener('click', (e) => {
                            const clickedValue = parseInt(e.target.value);
                            if (currentStatus === clickedValue) {
                                handleStatusChange(item, 0);
                            } else {
                                handleStatusChange(item, clickedValue);
                            }
                        });
                    });

                    itemList.appendChild(itemContainer);
                });
                sectionDiv.appendChild(itemList);
                taskListContainer.appendChild(sectionDiv);
            });
        }

        // Uygulamayı başlat
        setupFirebase();

    </script>
</body>
</html>
