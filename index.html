<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertel Lojistik - Yakıt Modülü Revizyonları (Canlı)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .task-item .task-text {
            transition: color 0.3s ease-in-out;
        }
        /* Frontend Bitti - Yeşil Çizgi */
        .status-fe-done .task-text {
            text-decoration: line-through;
            text-decoration-color: #22c55e; /* green-500 */
            text-decoration-thickness: 2px;
            color: #4ade80; /* green-400 */
        }
        /* Backend Bitti - Mavi Çizgi */
        .status-be-done .task-text {
            text-decoration: line-through;
            text-decoration-color: #3b82f6; /* blue-500 */
            text-decoration-thickness: 2px;
            color: #60a5fa; /* blue-400 */
        }
        /* FE Bitti, BE Bekleniyor - Turuncu Text */
        .status-fe-awaiting-be .task-text {
            color: #f97316; /* orange-500 */
            font-weight: 500;
        }
        /* BE Bitti, FE Bekleniyor - Koyu Turuncu Text */
        .status-be-awaiting-fe .task-text {
            color: #ca8a04; /* yellow-600 */
            font-weight: 500;
        }

        #connection-status {
            transition: opacity 0.5s;
        }
        .radio-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            min-width: 280px; /* Butonların sıkışmasını önle */
            margin-left: auto;
            padding-left: 1rem;
        }
        .radio-buttons input {
            cursor: pointer;
            width: 1.25rem;
            height: 1.25rem;
        }
        .radio-fe-done { accent-color: #22c55e; }
        .radio-be-done { accent-color: #3b82f6; }
        .radio-fe-awaiting-be { accent-color: #f97316; }
        .radio-be-awaiting-fe { accent-color: #ca8a04; }

        .legend-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 0.75rem;
            line-height: 1rem;
            color: #4b5563; /* gray-600 */
            font-weight: 500;
        }

        .note-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
        }
        .note-section.show {
            max-height: 150px;
            padding-top: 0.5rem;
            padding-bottom: 0.75rem;
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        
        <div class="flex items-center justify-between mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Sertel Lojistik - Yakıt Modülü Revizyonları</h1>
                <p class="text-gray-500 mt-1">Geliştirme ve iyileştirme görevlerinin canlı takip listesi.</p>
            </div>
             <div id="connection-status" class="flex items-center space-x-2 opacity-0">
                <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                <span id="connection-text" class="text-sm font-medium text-red-600">Bağlantı Kuruluyor...</span>
            </div>
        </div>

        <!-- İlerleme ve Özet Alanı -->
        <div class="mb-8 px-2">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-600">Genel Tamamlanma Oranı</span>
                <span id="progress-text" class="text-sm font-bold text-green-600">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="progress-bar" class="bg-green-500 h-3 rounded-full" style="width: 0%; transition: width 0.5s ease-in-out;"></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4 text-center">
                <div class="bg-green-50 p-3 rounded-lg">
                    <div id="completed-count" class="text-2xl font-bold text-green-700">0</div>
                    <div class="text-sm font-medium text-green-600">Tamamlandı</div>
                </div>
                <div class="bg-orange-50 p-3 rounded-lg">
                    <div id="waiting-for-be-count" class="text-2xl font-bold text-orange-700">0</div>
                    <div class="text-sm font-medium text-orange-600">Backend Bekleniyor</div>
                </div>
                <div class="bg-yellow-50 p-3 rounded-lg">
                    <div id="waiting-for-fe-count" class="text-2xl font-bold text-yellow-700">0</div>
                    <div class="text-sm font-medium text-yellow-600">Frontend Bekleniyor</div>
                </div>
            </div>
        </div>

        <!-- Legend -->
        <div class="mb-6 p-3 border rounded-lg bg-gray-50 flex items-center justify-center flex-wrap gap-x-6 gap-y-2 text-xs text-gray-700">
            <span class="font-bold text-gray-800">GÖSTERGE:</span>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span>FE Bitti</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                <span>BE Bitti</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-orange-500"></div>
                <span>BE Bekleniyor</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-yellow-600"></div>
                <span>FE Bekleniyor</span>
            </div>
        </div>

        <div id="task-list" class="space-y-6">
            <!-- Görevler buraya dinamik olarak eklenecek -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const tasks = [
            {
                section: "Genel Maddeler",
                items: [
                    { id: 'gm_1', text: 'Total ve Petrol Ofisi ekranları “Yakıt Modülü” altına taşınacak.', status: 0 },
                    { id: 'gm_2', text: 'Excel çıktıları alınamıyor.', status: 0 },
                    { id: 'gm_3', text: 'Plaka seçimlerinde çekici ve treyler plakaları ayrıştırılsın.', status: 0 },
                    { id: 'gm_4', text: 'Placeholder değeri “0” olan alanlar tıklandığında “0” değeri otomatik olarak kaybolmalı.', status: 0 },
                    { id: 'gm_5', text: 'Miktar ve km girilen alanlarda 3 basamaktan sonra otomatik olarak nokta gösterimi aktif hale getirilsin.', status: 0 },
                    { id: 'gm_6', text: 'Filtreler seçilmedikçe hiçbir filtre uygulanmasın.', status: 0 },
                    { id: 'gm_7', text: 'İsim listelerinde alfabetik sıralama sağlansın.', status: 0 },
                ]
            },
            {
                section: "Depo Hareketleri",
                items: [
                    { id: 'dh_1', text: 'İkonların düzeni karışık görünüyor.', status: 0 },
                    { id: 'dh_2', text: 'AdBlue ve Motorin için ayrı bir sütun eklenmeli ve bu alanda filtreleme yapılabilmeli.', status: 0 },
                ]
            },
            {
                section: "Yakıt Girişi",
                items: [
                    { id: 'yg_1', text: 'Bazı siparişlerde depo isimleri eksik geliyor. (Örnek: 111111 nolu sipariş)', status: 0 },
                    { id: 'yg_2', text: 'Zorunlu alanlar “*” işaretiyle gösterilsin.', status: 0 },
                    { id: 'yg_3', text: 'Kapasite aşımında uyarıya rağmen kayıt tabloya işleniyor (gerçek dolum olmasa da).', status: 0 },
                    { id: 'yg_4', text: 'Yakıt girişi yapılırken teslim alan kişiye sms doğrulaması gelmeli.', status: 0 },
                ]
            },
            {
                section: "Yakıt Tedarikçileri",
                items: [
                    { id: 'yt_1', text: 'Bread Crumbs yolu eski ekrana göre kalmış, güncellenmeli.', status: 0 },
                ]
            },
            {
                section: "Akaryakıt Depoları",
                items: [
                    { id: 'ad_1', text: '“Çalışanları Yönet” kısmında isimler listelenmiyor.', status: 0 },
                    { id: 'ad_2', text: 'Arama büyük/küçük harf duyarlı olmamalı ("ALİ" ve "ali" aynı sonucu vermeli).', status: 0 },
                    { id: 'ad_3', text: 'Düzenleme ekranındaki “Güncelle” butonu çalışmıyor.', status: 0 },
                ]
            },
            {
                section: "Entegre Depo Sınıfı",
                items: [
                    { id: 'eds_1', text: 'Hâlen boş kayıt oluşturulabiliyor.', status: 0 },
                ]
            },
            {
                section: "Depo Sınıfı",
                items: [
                    { id: 'ds_1', text: 'Depo sınıfında “Şube Bilgisi” alanı eklenmeli.', status: 0 },
                ]
            },
            {
                section: "Yakıt Çıkışı Veri Giriş Ekranı",
                items: [
                    { id: 'ycve_1', text: '“Araç Klima Güncel Sayaç” alanı yukarı taşınsın. Treyler plakası seçilirse aktif gelsin.', status: 0 },
                    { id: 'ycve_2', text: 'Çekici ve treyler plakaları aynı anda seçilemesin; plakalar türüne göre listelensin.', status: 0 },
                ]
            },
            {
                section: "Sipariş Veri İşleme Formu",
                items: [
                    { id: 'svif_1', text: '“Göz göz yakıt giriş alanı” veri işleme formunda hâlen uygulanmamış.', status: 0 },
                    { id: 'svif_2', text: 'Bread Crumbs yolu eski ekrana göre kalmış, güncellenmeli.', status: 0 },
                    { id: 'svif_3', text: 'Kantar tarihleri ilgili sipariş tarihinden öncesi seçilemesin.', status: 0 },
                    { id: 'svif_4', text: 'Kantar ölçümündeki mavi toplam kartlarının sayı görünümü düzeltilmeli.', status: 0 },
                ]
            },
            {
                section: "Yakıt Çıkış Raporları",
                items: [
                    { id: 'ycr_1', text: '“Görev Yeri” sütunu halen bulunmuyor.', status: 0 },
                ]
            }
        ];

        // --- UYGULAMA MANTIĞI ---
        const taskListContainer = document.getElementById('task-list');
        const connectionStatus = document.getElementById('connection-status');
        const connectionText = document.getElementById('connection-text');

        let isDataLoadedFromFirebase = false; // Verinin yüklendiğini kontrol eden bayrak

        let db;  
        let checklistDocRef; 

        async function setupFirebase() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyBkE1ZA4R8H8dtXzQK3_1f-ziASaqRWbNM",
                    authDomain: "checklist-44855.firebaseapp.com",
                    projectId: "checklist-44855",
                    storageBucket: "checklist-44855.firebasestorage.app",
                    messagingSenderId: "287422053970",
                    appId: "1:287422053970:web:0f47ebb4fa2e98aba0298b"
                };

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);
                
                const docPath = `checklists/sertel_tms_yakit_revizyon_v2`; // Döküman yolunu yeni liste için güncelledim.
                checklistDocRef = doc(db, docPath);

                await signInAnonymously(auth);
                
                listenForUpdates();

            } catch (error) {
                console.error("Firebase initialization error:", error);
                connectionStatus.style.opacity = 1;
                connectionText.textContent = `Bağlantı hatası. Ortak çalışma özelliği devre dışı.`;
                renderTasks();
            }
        }

        function listenForUpdates() {
            onSnapshot(checklistDocRef, (docSnap) => {
                const statusDiv = connectionStatus.querySelector('div');
                statusDiv.classList.remove('bg-red-500');
                statusDiv.classList.add('bg-green-500', 'animate-pulse');
                connectionText.textContent = 'Canlı Bağlantı Aktif';
                connectionText.classList.remove('text-red-600');
                connectionText.classList.add('text-gray-600');
                connectionStatus.style.opacity = 1;

                isDataLoadedFromFirebase = true; // Veri başarıyla okundu, artık kayıt yapılabilir.

                if (docSnap.exists()) {
                    const savedTasks = docSnap.data().tasks || [];
                    tasks.forEach(section => {
                        section.items.forEach(item => {
                            const savedItem = savedTasks.find(t => t.id === item.id);
                            if (savedItem && typeof savedItem.status === 'number') {
                                item.status = savedItem.status;
                                item.note = savedItem.note || ''; // Notu al
                            } else {
                                item.status = 0;
                                item.note = '';
                            }
                        });
                    });
                } else {
                    saveState();
                }
                renderTasks();
                updateProgress();
            }, (error) => {
                console.error("Firestore listener error:", error);
                const statusDiv = connectionStatus.querySelector('div');
                statusDiv.classList.add('bg-red-500');
                statusDiv.classList.remove('bg-green-500', 'animate-pulse');
                connectionText.textContent = 'Bağlantı Koptu';
                connectionText.classList.add('text-red-600');
                connectionText.classList.remove('text-gray-600');
                connectionStatus.style.opacity = 1;
            });
        }

        async function saveState() {
            if (!checklistDocRef) return;
            // Güvenlik kontrolü. Eğer veri sunucudan hiç yüklenmediyse, üzerine yazmayı engelle.
            if (!isDataLoadedFromFirebase) {
                console.warn("Veri sunucudan yüklenmediği için kaydetme işlemi engellendi.");
                return;
            }
            const stateToSave = tasks.flatMap(section => 
                section.items.map(item => ({ id: item.id, status: item.status, note: item.note || '' }))
            );
            try {
                await setDoc(checklistDocRef, { tasks: stateToSave });
            } catch (error) {
                console.error("Error saving state to Firestore:", error);
            }
        }
        
        function handleStatusChange(item, newStatus) {
            item.status = newStatus;
            renderTasks();
            updateProgress();
            saveState();
        }

        function updateProgress() {
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const completedCountEl = document.getElementById('completed-count');
            const waitingForBeCountEl = document.getElementById('waiting-for-be-count');
            const waitingForFeCountEl = document.getElementById('waiting-for-fe-count');

            if (!progressBar || !completedCountEl) return;

            const allItems = tasks.flatMap(s => s.items);
            const totalTasks = allItems.length;
            if (totalTasks === 0) return;

            const completedTasks = allItems.filter(item => item.status === 1 || item.status === 2).length;
            const waitingForBeTasks = allItems.filter(item => item.status === 3).length;
            const waitingForFeTasks = allItems.filter(item => item.status === 4).length;
            
            const percentage = Math.round((completedTasks / totalTasks) * 100);

            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}% (${completedTasks}/${totalTasks})`;

            completedCountEl.textContent = completedTasks;
            waitingForBeCountEl.textContent = waitingForBeTasks;
            waitingForFeCountEl.textContent = waitingForFeTasks;
        }

        function renderTasks() {
            taskListContainer.innerHTML = '';
            tasks.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.innerHTML = `<h2 class="text-xl font-semibold text-gray-700 border-b border-gray-200 pb-2 mb-4">${section.section}</h2>`;
                const itemList = document.createElement('div');
                itemList.className = 'space-y-1';

                section.items.forEach((item, index) => {
                    const itemContainer = document.createElement('div');
                    
                    let statusClass = '';
                    switch (item.status) {
                        case 1: statusClass = 'status-fe-done'; break;
                        case 2: statusClass = 'status-be-done'; break;
                        case 3: statusClass = 'status-fe-awaiting-be'; break;
                        case 4: statusClass = 'status-be-awaiting-fe'; break;
                    }

                    const hasNote = item.note && item.note.trim() !== '';
                    const noteIcon = hasNote 
                        ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2zM7 8H5v2h2V8zm2 0h2v2H9V8zm6 0h-2v2h2V8z" clip-rule="evenodd" /></svg>` 
                        : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" /></svg>`;

                    const taskRowHTML = `
                        <div class="task-item flex items-center p-2 rounded-lg hover:bg-gray-50 ${statusClass}">
                            <span class="flex-grow task-text font-medium text-gray-800">
                                <b class="text-gray-500 mr-2">${String.fromCharCode(97 + index)}.</b>${item.text}
                            </span>
                            <div class="radio-buttons">
                                <div class="flex justify-center"><input type="radio" class="radio-fe-done" name="status-${item.id}" value="1" title="Frontend %100 Tamamlandı" ${item.status === 1 ? 'checked' : ''}></div>
                                <div class="flex justify-center"><input type="radio" class="radio-be-done" name="status-${item.id}" value="2" title="Backend %100 Tamamlandı" ${item.status === 2 ? 'checked' : ''}></div>
                                <div class="flex justify-center"><input type="radio" class="radio-fe-awaiting-be" name="status-${item.id}" value="3" title="Frontend Tamamlandı, Backend Bekleniyor" ${item.status === 3 ? 'checked' : ''}></div>
                                <div class="flex justify-center"><input type="radio" class="radio-be-awaiting-fe" name="status-${item.id}" value="4" title="Backend Tamamlandı, Frontend Bekleniyor" ${item.status === 4 ? 'checked' : ''}></div>
                            </div>
                            <button class="note-toggle-btn ml-4 text-gray-400 hover:text-blue-600 p-1 rounded-full">
                                ${noteIcon}
                            </button>
                        </div>
                    `;

                    const noteSectionHTML = `
                        <div class="note-section bg-gray-50 rounded-b-lg px-4">
                            <textarea class="w-full p-2 border rounded-md text-sm mt-2" placeholder="Notunuzu buraya ekleyin...">${item.note || ''}</textarea>
                            <div class="text-right my-2">
                                <button class="note-save-btn text-sm bg-blue-500 text-white px-3 py-1 rounded-md hover:bg-blue-600">Kaydet</button>
                            </div>
                        </div>
                    `;
                    
                    itemContainer.innerHTML = taskRowHTML + noteSectionHTML;

                    const noteSection = itemContainer.querySelector('.note-section');

                    itemContainer.querySelector('.note-toggle-btn').addEventListener('click', () => {
                        noteSection.classList.toggle('show');
                    });

                    noteSection.querySelector('.note-save-btn').addEventListener('click', () => {
                        const noteText = noteSection.querySelector('textarea').value;
                        item.note = noteText;
                        saveState(); 
                        noteSection.classList.remove('show');
                    });
                    
                    const currentStatus = item.status;
                    itemContainer.querySelectorAll('input[type="radio"]').forEach(radio => {
                        radio.addEventListener('click', (e) => {
                            const clickedValue = parseInt(e.target.value);
                            if (currentStatus === clickedValue) {
                                handleStatusChange(item, 0);
                            } else {
                                handleStatusChange(item, clickedValue);
                            }
                        });
                    });

                    itemList.appendChild(itemContainer);
                });
                sectionDiv.appendChild(itemList);
                taskListContainer.appendChild(sectionDiv);
            });
        }

        // Uygulamayı başlat
        setupFirebase();

    </script>
</body>
</html>
