<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamik Isı - Yeni Görev Listesi (Canlı)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .task-item.in-progress .task-text {
            color: #a16207; /* amber-700 */
            font-weight: 500;
        }
        .task-item.completed .task-text,
        .task-item.completed .task-details {
            text-decoration: line-through;
            color: #9ca3af;
        }
        .progress-bar-fill {
            transition: width 0.5s ease-in-out;
        }
        .task-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding-left: 3.25rem;
            padding-right: 1rem;
        }
        .task-details.show {
            max-height: 200px; /* Veya içeriğe göre daha yüksek bir değer */
            padding-top: 0.5rem;
            padding-bottom: 0.75rem;
        }
        .status-icon {
            cursor: pointer;
            width: 1.5rem;
            height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.75rem;
            flex-shrink: 0;
            border-radius: 9999px;
        }
        #connection-status {
            transition: opacity 0.5s;
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        
        <div class="flex items-center justify-between mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Dinamik Isı - Yeni Geliştirme Görevleri</h1>
                <p class="text-gray-500 mt-1">Yeni toplantı notlarına göre oluşturulan görev takip listesi.</p>
            </div>
             <div id="connection-status" class="flex items-center space-x-2 opacity-0">
                <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                <span id="connection-text" class="text-sm font-medium text-red-600">Bağlantı Kuruluyor...</span>
            </div>
        </div>

        <div class="mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-600">Genel İlerleme (Tamamlananlar)</span>
                <span id="progress-text" class="text-sm font-bold text-blue-600">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full progress-bar-fill" style="width: 0%"></div>
            </div>
        </div>

        <div id="task-list" class="space-y-4">
            <!-- Görevler buraya dinamik olarak eklenecek -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const tasks = [
            {
                section: "Hata Düzeltmeleri (Bug Fixes)",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
                items: [
                    { id: 'netsis_depokodu_fix', text: "Sipariş Netsis'e Aktarıldığında Belge No Hatalı Oluşuyor.", status: 0, details: "Netsis'e Aktarma Başarıyla tamamlanıyor, ancak Belge No oluştururken hata var. Yurtiçi bir işlemde IHR koduyla oluşturmuş belge numarasını. Dökümcüler D, Fabrika FB, İhracay IHR gibi kodlara sahip, belge kodu oluşturma mantığının kontrolünü ve düzeltilmesini istiyorlar." },
                    { id: 'mail_ek_alici_fix', text: 'Teklif/Siparişteki Ek Mail Alanına Bildirim Gönderimini Aktif Et', status: 0, details: "Müşterinin kayıtlı mailine bilgilendirme gidiyor, ancak formda manuel olarak yazılan ek e-posta adreslerine bildirim gitmiyor. Bu sorun çözülmeli." },
                    { id: 'arama_iyilestirme', text: 'Ürün ve Cari Aramasını Daha Esnek Hale Getir', status: 0, details: "Arama daha 'içerir' (contains) mantığıyla çalışmalı. Örn; "MN" yazınca "MND" gelmiyor, 20-30 tane görüntüle dediğinde "belki" geliyor. MND yazmak gerekiyor. 28.000 cari arasında tam eşleşme beklemek zor oluyor.Hherkes her cariyi hatırlayamayabilir, burada aramanın daha iyi olmasını istiyorlar. " },
                    { id: 'rapor_sayfalama_fix', text: 'Cari Değişiklik Raporundaki Sayfalama Hatasını Düzelt', status: 0, details: "Sayfadaki toplam kayıt sayısı ile gösterilen kayıt sayısı arasında tutarsızlık var. Ekranda 2 kayıt varken 'Toplam 52 kayıt arasından 10 kayıt gösteriliyor' yazıyor. 100 Kayıt göster seçersek bile totalde 16 kayıt gösteriyor, tabloda 52 kayıt hiç yok. Bu sayım mantığı düzeltilmeli." },
                    { id: 'profil_ekran_fix', text: 'Müşteri Profili Ekranındaki Eksik Alanları Doldur', status: 0, details: "Müşteri profili ekranında eksik olan TC alanı eklenmeli. Ayrıca boş gelen VKN ve Vergi Dairesi alanlarının da dolu gelmesi sağlanmalı." },
                ]
            },
            {
                section: "Kullanıcı Arayüzü (UI/UX) İyileştirmeleri",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`,
                items: [
                    { id: 'netsis_sube_ui', text: 'Netsis Aktarma Formunda Şube Alanını Statik Yap', status: 0, details: "Şube alanı seçim listesi (dropdown) olarak gelmesin, direkt olarak basılı, değiştirilemez bir bilgi olarak görünsün." },
                    { id: 'otomatik_varsayilan', text: 'İlk İletişim ve Adresi Otomatik Varsayılan Yap', status: 0, details: "Kullanıcılar varsayılan işaretlemeyi unuttuğu için sorun yaşıyor. Bir cariye eklenen ilk iletişim kişisi ve ilk adres kaydı, otomatik olarak 'varsayılan' olarak işaretlensin." },
                    { id: 'telefon_arama_link', text: 'Telefon Numaralarını Tıklanabilir Arama Linkine Dönüştür', status: 0, details: "Özellikle mobil cihazlardan giriş yapıldığında, sistemdeki telefon numaralarına tıklandığında doğrudan arama (`tel:`) başlatılabilsin." },
                    { id: 'telefon_formatlama', text: 'Telefon Alanlarına Ülke Koduna Göre Otomatik Formatlama Ekle', status: 0, details: "Cari bilgileri ve İletişim bilgileri ekranlarına 'Ülke Kodu' alanı eklensin. Telefon numarası giriş alanı, seçilen bu ülke koduna göre otomatik formatlansın ve ülke kodu zorunlu olsun." },
                ]
            },
            {
                section: "Yeni Özellikler ve Yetkilendirme",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
                items: [
                    { id: 'siparis_detay_alanlar', text: 'Teklifteki Ek Alanları Sipariş Detayına Taşı', status: 0, details: "Teklif oluştururken girilen 'Müşteri Sip. No.', 'İr. Fat.' ve 'İr. İlgili Kişi' alanları, teklif siparişe dönüştüğünde sipariş detay formunda da görünür olmalı." },
                    { id: 'tc_vkn_kontrol', text: 'Yeni Müşteri Formuna TC/VKN Kilitlenme Mantığı Ekle', status: 0, details: "CustomerTemp için TC girildiğinde VKN/Vergi Dairesi alanları, VKN/VD girildiğinde ise TC alanı kilitlensin (disable olsun)." },
                    { id: 'siparis_silme_yetki', text: 'İptal Edilmiş Siparişleri Silme Yetkisi Ekle', status: 0, details: "Kullanıcılar, 'iptal' statüsündeki siparişleri silebilmek istiyor. Bu işlemi yapabilecek yeni ve özel bir yetki (rol) tanımlanmalı. Ayrıca, bir 'Delete' metodu da gerekecek." },
                ]
            },
            {
                section: "E-Posta Bildirimleri",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>`,
                items: [
                    { id: 'onay_maili_herkese', text: 'Onay Bekleyen Talepler İçin Yetkililere Mail Gönder', status: 0, details: "Bir talep 'Finans Onayı' veya 'Planlama Onayı' statüsüne geçtiğinde, o role sahip tüm kullanıcılara bilgilendirme maili gitsin." },
                    { id: 'musteri_mail_optimizasyon', text: 'Müşteriye Giden Bildirim Maili Sayısını Azalt', status: 0, details: "Müşteriye sadece iki durumda mail gitsin: 1) Teklif ilk oluşturulduğunda. 2) Planlama onaylayıp siparişe dönüştüğünde. Aradaki finans onayı gibi adımlarda müşteriye mail gitmesin." },
                ]
            },
             {
                section: "Veri Temizliği ve Kapanış",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`,
                items: [
                    { id: 'test_veri_temizle', text: 'Proje Sonunda Test Verilerini Temizle', status: 0, details: "Tüm geliştirmeler tamamlandıktan sonra, carisi 'Habib Yılmaz' ve 'Sedbim' olan tüm test amaçlı teklif ve sipariş kayıtları sistemden silinsin." },
                ]
            }
        ];

        // --- UYGULAMA MANTIĞI ---
        const taskListContainer = document.getElementById('task-list');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const connectionStatus = document.getElementById('connection-status');
        const connectionText = document.getElementById('connection-text');

        let db; 
        let checklistDocRef; 

        async function setupFirebase() {
            try {
                const firebaseConfig = {
                  apiKey: "AIzaSyBkE1ZA4R8H8dtXzQK3_1f-ziASaqRWbNM",
                  authDomain: "checklist-44855.firebaseapp.com",
                  projectId: "checklist-44855",
                  storageBucket: "checklist-44855.firebasestorage.app",
                  messagingSenderId: "287422053970",
                  appId: "1:287422053970:web:0f47ebb4fa2e98aba0298b"
                };

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);
                
                const docPath = `checklists/dinamik_isi_yeni_istekler_v2`;
                checklistDocRef = doc(db, docPath);

                await signInAnonymously(auth);
                
                listenForUpdates();

            } catch (error) {
                console.error("Firebase initialization error:", error);
                connectionStatus.style.opacity = 1;
                connectionText.textContent = `Bağlantı hatası: ${error.message}. Ortak çalışma özelliği devre dışı.`;
                renderTasks();
                updateProgress();
            }
        }

        function listenForUpdates() {
            onSnapshot(checklistDocRef, (docSnap) => {
                const statusDiv = connectionStatus.querySelector('div');
                statusDiv.classList.remove('bg-red-500');
                statusDiv.classList.add('bg-green-500', 'animate-pulse');
                connectionText.textContent = 'Canlı Bağlantı Aktif';
                connectionText.classList.remove('text-red-600');
                connectionText.classList.add('text-gray-600');
                connectionStatus.style.opacity = 1;

                if (docSnap.exists()) {
                    const savedTasks = docSnap.data().tasks || [];
                    tasks.forEach(section => {
                        section.items.forEach(item => {
                            const savedItem = savedTasks.find(t => t.id === item.id);
                            if (savedItem && typeof savedItem.status === 'number') {
                                item.status = savedItem.status;
                            } else {
                                item.status = 0;
                            }
                        });
                    });
                } else {
                    saveState();
                }
                renderTasks();
                updateProgress();
            }, (error) => {
                console.error("Firestore listener error:", error);
                const statusDiv = connectionStatus.querySelector('div');
                statusDiv.classList.add('bg-red-500');
                statusDiv.classList.remove('bg-green-500', 'animate-pulse');
                connectionText.textContent = 'Bağlantı Koptu';
                connectionText.classList.add('text-red-600');
                connectionText.classList.remove('text-gray-600');
                connectionStatus.style.opacity = 1;
            });
        }

        async function saveState() {
            if (!checklistDocRef) return;
            // DÜZELTME: Sadece status'ü number olanları kaydet
            const stateToSave = tasks.flatMap(section => 
                section.items.map(item => ({ id: item.id, status: typeof item.status === 'number' ? item.status : 0 }))
            );
            try {
                await setDoc(checklistDocRef, { tasks: stateToSave });
            } catch (error) {
                console.error("Error saving state to Firestore:", error);
            }
        }
        
        function updateProgress() {
            const allItems = tasks.flatMap(s => s.items);
            const totalTasks = allItems.length;
            const completedTasks = allItems.filter(item => item.status === 2).length;

            const percentage = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}% (${completedTasks}/${totalTasks})`;
        }

        function handleStatusClick(item) {
            item.status = (item.status + 1) % 3; // 0 -> 1 -> 2 -> 0
            renderTasks();
            updateProgress();
            saveState();
        }

        function toggleDetails(itemId) {
            const detailsElement = document.querySelector(`.task-details[data-id="${itemId}"]`);
            if (detailsElement) {
                detailsElement.classList.toggle('show');
            }
        }

        function renderTasks() {
            taskListContainer.innerHTML = '';
            tasks.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.innerHTML = `<div class="flex items-center border-b border-gray-200 pb-2 mb-4">${section.icon}<h2 class="text-xl font-semibold text-gray-700">${section.section}</h2></div>`;
                const itemList = document.createElement('div');
                itemList.className = 'space-y-1';

                section.items.forEach(item => {
                    const taskWrapper = document.createElement('div');
                    
                    let statusClass = '';
                    let statusIcon = `<div class="status-icon border-2 border-gray-300"></div>`; // To Do
                    if (item.status === 1) { // In Progress
                        statusClass = 'in-progress';
                        statusIcon = `<div class="status-icon bg-yellow-400 text-white"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>`;
                    } else if (item.status === 2) { // Completed
                        statusClass = 'completed';
                        statusIcon = `<div class="status-icon bg-blue-500 border-blue-500 text-white"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg></div>`;
                    }

                    taskWrapper.innerHTML = `
                        <div class="task-item flex items-center p-2 rounded-lg ${statusClass}">
                            <div class="status-container"></div>
                            <label class="flex-grow cursor-pointer task-text font-medium text-gray-800">${item.text}</label>
                            <button class="details-btn ml-4 text-gray-400 hover:text-blue-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                        <div class="task-details text-sm text-gray-600 bg-gray-50 rounded-b-lg" data-id="${item.id}">
                            <p class="font-mono p-2 bg-gray-200 text-gray-700 rounded text-xs">${item.details}</p>
                        </div>
                    `;

                    const statusContainer = taskWrapper.querySelector('.status-container');
                    statusContainer.innerHTML = statusIcon;
                    statusContainer.addEventListener('click', () => handleStatusClick(item));

                    const detailsBtn = taskWrapper.querySelector('.details-btn');
                    detailsBtn.addEventListener('click', () => toggleDetails(item.id));
                    
                    itemList.appendChild(taskWrapper);
                });
                sectionDiv.appendChild(itemList);
                taskListContainer.appendChild(sectionDiv);
            });
        }

        // Uygulamayı başlat
        setupFirebase();

    </script>
</body>
</html>
